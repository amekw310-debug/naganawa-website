name: Preview shot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Shoot preview
        run: |
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const base='https://amekw310-debug.github.io/naganawa-website/';
            // contact PC
            const pc=await b.newPage({viewport:{width:1280,height:900}});
            await pc.goto(base+'contact.html?cb='+Date.now(),{waitUntil:'load',timeout:90000}).catch(e=>console.log('err',e.message));
            await pc.waitForTimeout(6000);
            await pc.screenshot({path:'contact_pc.jpg',type:'jpeg',quality:72,fullPage:true});
            await pc.close();
            // contact SP
            const sp=await b.newPage({viewport:{width:390,height:820},isMobile:true,deviceScaleFactor:2});
            await sp.goto(base+'contact.html?cb='+Date.now(),{waitUntil:'load',timeout:90000}).catch(()=>{});
            await sp.waitForTimeout(6000);
            await sp.screenshot({path:'contact_sp.jpg',type:'jpeg',quality:72,fullPage:true});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node s.js
          ls -la *.jpg
      - name: Encode + commit
        run: |
          mkdir -p pv
          for f in contact_pc contact_sp; do base64 -w0 ${f}.jpg > pv/${f}.b64.txt; done
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -B preview-shot
          git add -f pv/
          git commit -m "preview shots (contact)"
          git push -f origin preview-shot

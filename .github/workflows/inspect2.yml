name: Inspect server now
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Inspect
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          OPT="set ftp:ssl-allow false; set ftp:passive-mode true;"
          L() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$OPT $1; bye" 2>/dev/null; }
          echo "===== /htdocs 直下 ====="
          L "cls -l /htdocs/" | head -80
          echo ""
          echo "===== /htdocs/_newhp_hidden（あれば） ====="
          L "find /htdocs/_newhp_hidden" 2>/dev/null | head -60 || echo "(なし)"
          echo ""
          echo "===== /htdocs/images 直下のファイル（サブフォルダ除く傾向） ====="
          L "cls -l /htdocs/images/" | head -80
          echo ""
          echo "===== /htdocs/news（あれば） ====="
          L "find /htdocs/news" 2>/dev/null | head -30 || echo "(なし)"
          echo ""
          echo "===== 判定: index.html ====="
          ic=$(L "cat /htdocs/index.html")
          printf '%s' "$ic" | grep -io '<title>[^<]*</title>' | head -1
          printf '%s' "$ic" | grep -q 'G-54DCFCLL2R' && echo "→ 新HP(GAあり)" || echo "→ 旧HP(GAなし)"
          printf '%s' "$ic" | grep -qi 'list-inline-item' && echo "→ 旧HP(list-inline-item)"
          printf '%s' "$ic" | grep -qi 'tayori-form-wrap' && echo "→ 新HP(tayori-form-wrap)"
          echo ""
          echo "===== style.css 先頭3行（再構築か新HP版か） ====="
          L "cat /htdocs/style.css" | head -3
          echo ""
          echo "===== contact.html 判定 ====="
          cc=$(L "cat /htdocs/contact.html")
          printf '%s' "$cc" | grep -io '<title>[^<]*</title>' | head -1
          printf '%s' "$cc" | grep -qi 'tayori' && echo "→ tayori言及あり"

name: Preview (GitHub Pages)

# 新HPの「プレビュー専用」。github.io の別URLに配信します。
# 本番（naganawa-k.co.jp / CANONET FTP）とは完全に別で、影響しません。
# main に push すると自動でプレビューが更新されます。
#
# 【microCMS 連携方式：クライアント取得 + キーのビルド時注入】
#   - お知らせはブラウザ側（js/microcms.js）で microCMS から取得して表示します。
#   - APIキーの実値はリポジトリにコミットしません。リポジトリの
#     js/microcms.js にはプレースホルダー __MICROCMS_API_KEY__ を置き、
#     このワークフローが Secrets(MICROCMS_API_KEY) の値を、公開用にコピーした
#     _site/js/microcms.js にのみ差し込みます（scripts/inject-microcms-key.mjs）。
#   - 公開前に microCMS へ実際に GET して 200 を確認し、401 等なら
#     デプロイを中止します（公開中サイトは無傷）。
#   - サービスドメイン(naganawa-k)は公開情報のため js/microcms.js に直書きです。

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [microcms-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify microCMS API key (fail fast on 401)
        # Secrets のキーで実際に GET し、200 以外ならデプロイを止める。
        # キー値はログに出さず、HTTPステータスのみ表示する。
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          if [ -z "$MICROCMS_API_KEY" ]; then
            echo "::error::Secret MICROCMS_API_KEY が未設定です。Settings→Secrets を確認してください。"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-MICROCMS-API-KEY: $MICROCMS_API_KEY" \
            "https://naganawa-k.microcms.io/api/v1/news?limit=1")
          echo "microCMS /news HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::microCMS 認証チェック失敗 (HTTP $code)。キー無効/GET権限不足/Secret名相違の可能性。"
            exit 1
          fi
          echo "microCMS auth OK (200)."

      - name: Prepare preview (exclude tooling files)
        run: |
          mkdir -p _site
          # リポジトリ直下をコピー（.git / .github / ビルド用ファイルは除外）
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='scripts' --exclude='templates' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='node_modules' \
            ./ _site/
          # 検索避け（プレビューがインデックスされないように）
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - name: Inject microCMS API key into published JS
        # 公開用 _site/js/microcms.js のプレースホルダーにのみキーを注入。
        # リポジトリ本体の js/microcms.js はプレースホルダーのまま。
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: node scripts/inject-microcms-key.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy verify PUBLISHED js (placeholder gone / key valid / same key)
        # 実際に公開された js/microcms.js を取得して検証する。
        # ・__MICROCMS_API_KEY__ が残っていないか（=注入がPagesに反映されたか）
        # ・公開ファイルのキーで microCMS が 200 か（=Verifyと同一キーで統一）
        # キー値は一切出力せず、長さ・一致(MATCH)・HTTPステータスのみ表示する。
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          url="https://amekw310-debug.github.io/naganawa-website/js/microcms.js"
          pub=""
          for i in $(seq 1 10); do
            pub=$(curl -s -m 20 "$url" || true)
            if printf '%s' "$pub" | grep -q "var API_KEY"; then break; fi
            echo "Pages 反映待ち... ($i)"; sleep 15
          done
          echo "----- published cache headers -----"
          curl -s -I -m 20 "$url" | grep -iE 'age:|cache-control|etag|last-modified' || true
          echo "-----------------------------------"
          if printf '%s' "$pub" | grep -q "__MICROCMS_API_KEY__"; then
            echo "::error::公開ファイルに __MICROCMS_API_KEY__ が残存（注入未反映＝Pagesがブランチ配信/キャッシュの可能性）。"
            exit 1
          fi
          pubkey=$(printf '%s' "$pub" | grep -oE "var API_KEY[^;]*" | grep -oE "'[^']*'" | head -1 | tr -d "'")
          if [ -z "$pubkey" ]; then echo "::error::公開ファイルからAPI_KEYを抽出できません"; exit 1; fi
          echo "published API_KEY length: $(printf '%s' "$pubkey" | awk '{print length}')"
          if [ "$pubkey" = "$MICROCMS_API_KEY" ]; then echo "published key == secret: MATCH"; else echo "::warning::published key != secret"; fi
          pcode=$(curl -s -o /dev/null -w "%{http_code}" -H "X-MICROCMS-API-KEY: $pubkey" "https://naganawa-k.microcms.io/api/v1/news?limit=1")
          echo "published-key microCMS status: $pcode"
          if [ "$pcode" != "200" ]; then echo "::error::公開ファイルのキーで microCMS $pcode。"; exit 1; fi
          echo "PUBLISHED FILE OK (placeholder除去済み・キー有効200)。"

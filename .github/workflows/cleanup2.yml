name: Cleanup restore assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary emergency files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -r --ignore-unmatch restore-assets
          git rm --ignore-unmatch .github/workflows/restore-oldhp.yml
          git rm --ignore-unmatch .github/workflows/inspect2.yml
          git rm --ignore-unmatch .github/workflows/cleanup2.yml
          git commit -m "cleanup: 応急復旧の一時ファイル/ワークフローを削除（本番は旧HPで安定）" || echo "nothing to commit"
          git push origin main

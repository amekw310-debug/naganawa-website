name: Deploy form-test folder
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Upload to /htdocs/form-test/
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          OPT="set ftp:ssl-allow false; set ftp:passive-mode true;"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$OPT
            mkdir -f /htdocs/form-test;
            mkdir -f /htdocs/form-test/images;
            put contact.html        -o /htdocs/form-test/contact.html;
            put contact_mail.php     -o /htdocs/form-test/contact_mail.php;
            put config.php           -o /htdocs/form-test/config.php;
            put contact_thanks.html  -o /htdocs/form-test/contact_thanks.html;
            put contact_error.html   -o /htdocs/form-test/contact_error.html;
            put style.css            -o /htdocs/form-test/style.css;
            put images/logo.png      -o /htdocs/form-test/images/logo.png;
            put images/favicon.png   -o /htdocs/form-test/images/favicon.png;
            bye" 2>/dev/null
          echo "===== /htdocs/form-test/ ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$OPT cls -l /htdocs/form-test/; echo '--- images ---'; cls -l /htdocs/form-test/images/; bye" 2>/dev/null

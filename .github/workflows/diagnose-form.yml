name: Diagnose form-test
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: HTTP tests (each with timeout)
        run: |
          BASE="https://naganawa-k.co.jp/form-test"
          T="--connect-timeout 15 --max-time 30"
          echo "===== 1) GET contact.html ====="
          curl -sS $T -o /dev/null -w "HTTP %{http_code} / type=%{content_type} / time=%{time_total}s\n" "$BASE/contact.html" || echo "→ タイムアウト/失敗"
          echo ""
          echo "===== 2) GET contact_mail.php（直アクセス）====="
          curl -sS $T -o /tmp/g.txt -w "HTTP %{http_code} / type=%{content_type} / time=%{time_total}s\n" "$BASE/contact_mail.php" || echo "→ タイムアウト/失敗"
          echo "--- body先頭6行（生PHPが見えたら未実行）---"; head -6 /tmp/g.txt 2>/dev/null
          echo "--- <?php 出現数 ---"; grep -c '<?php' /tmp/g.txt 2>/dev/null || echo 0
          echo ""
          echo "===== 3) POST phase=check（確認画面が返るか）====="
          curl -sS $T -X POST "$BASE/contact_mail.php" \
            --data-urlencode "phase=check" \
            --data-urlencode "name=テスト太郎" \
            --data-urlencode "kana=てすとたろう" \
            --data-urlencode "phone=0568-81-6099" \
            --data-urlencode "email=formtest@example.com" \
            --data-urlencode "contents=接続診断テスト" \
            -o /tmp/check.txt -w "HTTP %{http_code} / time=%{time_total}s\n" || echo "→ タイムアウト/失敗（確認画面生成で停止？）"
          echo "--- title ---"; grep -o '<title>[^<]*</title>' /tmp/check.txt 2>/dev/null | head -1
          echo "--- 「入力内容の確認」出現数 ---"; grep -c '入力内容の確認' /tmp/check.txt 2>/dev/null || echo 0
          echo "--- <?php 出現数 ---"; grep -c '<?php' /tmp/check.txt 2>/dev/null || echo 0
          echo ""
          echo "===== 4) POST phase=send（実メール送信・診断／最長60秒待つ）====="
          curl -sS --connect-timeout 15 --max-time 60 -X POST "$BASE/contact_mail.php" \
            --data-urlencode "phase=send" \
            --data-urlencode "name=テスト太郎" \
            --data-urlencode "kana=てすとたろう" \
            --data-urlencode "phone=0568-81-6099" \
            --data-urlencode "email=formtest@example.com" \
            --data-urlencode "contents=接続診断テスト（送信フェーズ）" \
            -o /tmp/send.txt -D /tmp/send_h.txt -w "HTTP %{http_code} / time=%{time_total}s\n" || echo "→ タイムアウト/失敗（メール送信でハングの疑い＝原因の可能性大）"
          echo "--- 応答ヘッダ（Location=thanksなら送信処理は完了）---"; head -15 /tmp/send_h.txt 2>/dev/null
      - name: Fetch server log
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          OPT="set ftp:ssl-allow false; set ftp:passive-mode true; set net:timeout 20;"
          echo "===== contact_mail_error.log ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$OPT cat /htdocs/form-test/contact_mail_error.log; bye" 2>/dev/null || echo "(ログ無し)"
          echo ""
          echo "===== form-test 一覧 ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$OPT cls -l /htdocs/form-test/; bye" 2>/dev/null
